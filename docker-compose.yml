# Bancos para desenvolvimento local.
#   docker compose up -d mysql                  -> MySQL 8 (padrão do dia a dia)
#   docker compose --profile sqlserver up -d    -> também sobe um SQL Server 2022 para testar a migração
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: boaspraticas
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-dados:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sqlserver"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Boas@Praticas2026"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-dados:/var/opt/mssql

volumes:
  mysql-dados:
  sqlserver-dados:
